<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trader Registration - Giraffe Event Spaces Ltd</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #0b0b0b; color: #f4f4f4; padding: 40px 20px; }
        .form-container { max-width: 750px; background: #121212; margin: 0 auto; padding: 30px; border-radius: 8px; border: 1px solid #bf9b30; box-shadow: 0 4px 15px rgba(191,155,48,0.15); }
        .logo-placeholder { text-align: center; margin-bottom: 20px; font-weight: bold; color: #bf9b30; font-size: 24px; letter-spacing: 2px; }
        h1 { text-align: center; color: #bf9b30; font-size: 26px; margin-bottom: 5px; text-transform: uppercase; }
        .subtitle { text-align: center; color: #a1a1a1; font-size: 14px; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; }
        h2 { color: #bf9b30; font-size: 18px; border-bottom: 1px solid #bf9b30; padding-bottom: 5px; margin-top: 30px; text-transform: uppercase; }
        .form-group { margin-bottom: 20px; }
        .form-row { display: flex; gap: 20px; }
        .form-row .form-group { flex: 1; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #e0e0e0; font-size: 14px; }
        input[type="text"], input[type="email"], input[type="tel"], select, textarea { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #333; border-radius: 4px; color: #fff; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus, textarea:focus { border-color: #bf9b30; outline: none; }
        .checkbox-group { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 15px; }
        .checkbox-group input { margin-top: 3px; }
        .checkbox-group label { font-weight: normal; color: #c0c0c0; cursor: pointer; }
        .terms-box { height: 250px; overflow-y: scroll; background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 4px; font-size: 12px; line-height: 1.6; color: #b3b3b3; margin-bottom: 20px; }
        .conditional-section { background: #161616; padding: 15px; border-left: 3px solid #bf9b30; border-radius: 0 4px 4px 0; margin-top: 15px; display: none; }
        button { background: #bf9b30; color: #000; border: none; padding: 14px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; text-transform: uppercase; margin-top: 20px; }
        button:hover { background: #d4ac3d; }
        @media (max-width: 600px) { .form-row { flex-direction: column; gap: 0; } }
    </style>
</head>
<body>

<div class="form-container">
    <div class="logo-placeholder">GIRAFFE EVENT SPACES LTD</div>
    <h1>Trader Registration</h1>
    <div class="subtitle">Business & Event Details</div>
    
    <form action="https://web3forms.com" method="POST">
        <input type="hidden" name="access_key" value="PASTE_YOUR_KEY_HERE">
        <input type="hidden" name="subject" value="New Trader Registration - St Paul's Christmas Market">

        <!-- 1. TRADER / BUSINESS DETAILS -->
        <h2>1. Trader / Business Details</h2>
        <div class="form-group">
            <label for="trading_name">Trading / Business Name</label>
            <input type="text" id="trading_name" name="trading_name" required placeholder="e.g. Smith's Crafts">
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="contact_name">Contact Full Name</label>
                <input type="text" id="contact_name" name="contact_name" required placeholder="e.g. Jane Smith">
            </div>
            <div class="form-group">
                <label for="contact_email">Contact Email Address</label>
                <input type="email" id="contact_email" name="contact_email" required placeholder="e.g. jane@example.com">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="contact_phone">Contact Telephone Number</label>
                <input type="tel" id="contact_phone" name="contact_phone" required placeholder="e.g. 07466125584">
            </div>
            <div class="form-group">
                <label for="website">Website / Social Media (Optional)</label>
                <input type="text" id="website" name="website_social" placeholder="e.g. ://facebook.com">
            </div>
        </div>

        <div class="form-group">
            <label for="business_address">Business / Trading Address</label>
            <textarea id="business_address" name="business_address" rows="3" required placeholder="Enter full address details..."></textarea>
        </div>

        <!-- 2. EVENT / PITCH DETAILS -->
        <h2>2. Event / Pitch Details</h2>
        <div class="form-group">
            <label for="event_name">Event / Market Name</label>
            <input type="text" id="event_name" name="event_name" value="St Paul's Church Hall Christmas Market" readonly>
        </div>

        <div class="form-group">
            <label for="pitch_info">Preferred / Allocated Pitch Information (if known)</label>
            <input type="text" id="pitch_info" name="pitch_info" placeholder="Leave blank if unknown">
        </div>

        <div class="form-group">
            <label for="selling_description">What will you be selling / providing?</label>
            <textarea id="selling_description" name="selling_description" rows="3" required placeholder="Provide itemized summary of products..."></textarea>
        </div>

        <div class="form-group">
            <label for="special_requirements">Any special requirements or information for the Organiser?</label>
            <textarea id="special_requirements" name="special_requirements" rows="2"></textarea>
        </div>

        <!-- 3. COMPLIANCE & DOCUMENT SUBMISSION -->
        <h2>3. Compliance & Document Submission</h2>
        <div class="checkbox-group">
            <input type="checkbox" id="doc_rams" name="declares_rams" value="Yes" required>
            <label for="doc_rams"><strong>Risk Assessment & Method Statement (RAMS):</strong> I confirm I will provide a written Risk Assessment covering set-up, operational hours, and pack-down.</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="doc_pli" name="declares_pli" value="Yes" required>
            <label for="doc_pli"><strong>Public Liability Insurance (PLI):</strong> I confirm I hold valid PLI cover with a minimum cover of £1,000,000 valid for the event dates.</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="doc_pat" name="declares_pat" value="Yes">
            <label for="doc_pat"><strong>PAT Certificate(s):</strong> I confirm all electrical appliances brought onto site carry a valid test certificate.</label>
        </div>
        <div class="checkbox-group">
            <input type="checkbox" id="doc_gas" name="declares_gas" value="Yes">
            <label for="doc_gas"><strong>Gas Safe / LPG / CP42 Certificate:</strong> I confirm any gas appliances possess a current safety certificate.</label>
        </div>

        <!-- 4. FOOD & BEVERAGE VENDORS -->
        <h2>4. Food & Beverage Vendors</h2>
        <div class="form-group">
            <label for="food_vendor_select">Are you a food and/or beverage vendor?</label>
            <select id="food_vendor_select" name="food_and_beverage_vendor" onchange="toggleFoodSection(this.value)" required>
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select>
        </div>

        <div id="food-vendor-section" class="conditional-section">
            <p style="font-size: 13px; color: #bf9b30; margin-bottom: 15px; font-weight: bold;">FOOD VENDOR DOCUMENTS — ONLINE MANDATE</p>
            <div class="checkbox-group">
                <input type="checkbox" id="food_reg" name="food_local_authority_registered" value="Yes">
                <label for="food_reg">I confirm proof of local authority / food safety registration.</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="food_rating" name="food_hygiene_rating_3_plus" value="Yes">
                <label for="food_rating">I confirm a valid Food Hygiene Rating score of at least 3.</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="food_cert" name="food_handlers_certified" value="Yes">
                <label for="food_cert">I confirm food handler hygiene certificates are held for all attending staff.</label>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="food_allergen" name="food_allergen_matrix_displayed" value="Yes">
                <label for="food_allergen">I confirm a complete Allergen Matrix will be displayed clearly at my pitch.</label>
            </div>
        </div>

        <!-- 5. POWER & EQUIPMENT -->
        <h2>5. Power & Equipment</h2>
        <div class="form-row">
            <div class="form-group">
                <label for="power_require">Do you require power?</label>
                <select id="power_require" name="requires_power" required>
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                </select>
            </div>
            <div class="form-group">
                <label for="extension_lead">Do you have a 25m exterior lead?</label>
                <select id="extension_lead" name="has_25m_extension_lead" required>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
